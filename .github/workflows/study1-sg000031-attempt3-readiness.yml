name: DAL R2 Attempt-3 engineering readiness (NO DISPATCH)

on:
  pull_request:
    paths:
      - registry/study1_sg000031_attempt3_readiness_contract.json
      - tools/qualify_sg000031_attempt3_readiness.py
      - tests/test_study1_sg000031_attempt3_readiness.py
      - .github/workflows/study1-sg000031-attempt3-readiness.yml
      - docs/study1-sg000031-attempt3-readiness.md
  push:
    branches: [main]
    paths:
      - registry/study1_sg000031_attempt3_readiness_contract.json
      - tools/qualify_sg000031_attempt3_readiness.py
      - tests/test_study1_sg000031_attempt3_readiness.py
      - .github/workflows/study1-sg000031-attempt3-readiness.yml
      - docs/study1-sg000031-attempt3-readiness.md

permissions:
  contents: read

concurrency:
  group: dal-attempt3-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  native-readiness:
    name: Attempt-3 read-only readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install deterministic tests and DAL
        run: python -m pip install -e '.[dev]'
      - name: Run fail-closed readiness regressions
        run: python -m pytest tests/test_study1_sg000031_attempt3_readiness.py -q
      - name: Verify real historical Git ancestry and consumed claim read-only
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          python tools/qualify_sg000031_attempt3_readiness.py
          --output "$RUNNER_TEMP/attempt3-readiness.json"
      - name: Retain actual zero-inference readiness report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sg000031-attempt3-readiness-${{ github.run_id }}
          path: ${{ runner.temp }}/attempt3-readiness.json
          if-no-files-found: error
          retention-days: 30
