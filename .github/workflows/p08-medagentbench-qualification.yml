name: GAX P08 MedAgentBench Qualification

on:
  pull_request:
    paths:
      - ".github/workflows/p08-medagentbench-qualification.yml"
      - ".specgrain/specs/SG-000016.json"
      - "src/gaxbench/medagentbench_qualification.py"
      - "src/gaxbench/medagentbench_audit.py"
      - "tests/test_medagentbench_qualification.py"
      - "docs/datasets/MEDAGENTBENCH.md"
      - "registry/p08_real_inventory.json"
      - "registry/medagentbench_source_probe.json"
      - "registry/medagentbench_role_manifest.json"
      - "registry/medagentbench_runtime_status.json"
      - "registry/medagentbench_leakage_audit.json"
      - "registry/medagentbench_qualification.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/p08-medagentbench-qualification.yml"
      - ".specgrain/specs/SG-000016.json"
      - "src/gaxbench/medagentbench_qualification.py"
      - "src/gaxbench/medagentbench_audit.py"
      - "tests/test_medagentbench_qualification.py"
      - "docs/datasets/MEDAGENTBENCH.md"
      - "registry/p08_real_inventory.json"
      - "registry/medagentbench_source_probe.json"
      - "registry/medagentbench_role_manifest.json"
      - "registry/medagentbench_runtime_status.json"
      - "registry/medagentbench_leakage_audit.json"
      - "registry/medagentbench_qualification.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify-medagentbench:
    name: Frozen MedAgentBench public-corpus qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Download frozen public MedAgentBench corpus files
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          from gaxbench.medagentbench_qualification import (
              MEDAGENTBENCH_FUNCTION_RAW_URL,
              MEDAGENTBENCH_TASK_RAW_URL,
          )

          root = Path("${{ runner.temp }}") / "medagentbench-source"
          root.mkdir(parents=True, exist_ok=True)
          for name, url in (
              ("test_data_v2.json", MEDAGENTBENCH_TASK_RAW_URL),
              ("funcs_v1.json", MEDAGENTBENCH_FUNCTION_RAW_URL),
          ):
              with urlopen(url, timeout=60) as response:
                  payload = response.read()
              (root / name).write_bytes(payload)
              print(f"downloaded_{name}_bytes={len(payload)}")

      - name: Generate metadata-only qualification evidence
        shell: python
        run: |
          import json
          from pathlib import Path
          from gaxbench.medagentbench_audit import write_leakage_audit
          from gaxbench.medagentbench_qualification import write_medagentbench_evidence

          source = Path("${{ runner.temp }}") / "medagentbench-source"
          output = Path("${{ runner.temp }}") / "medagentbench-qualification"
          write_medagentbench_evidence(
              source / "test_data_v2.json",
              source / "funcs_v1.json",
              output,
          )
          audit_sha256 = write_leakage_audit(
              output / "source_probe.json",
              output / "leakage_audit.json",
          )
          qualification = json.loads(
              (output / "qualification.json").read_text(encoding="utf-8")
          )
          if audit_sha256 != qualification["audit_sha256"]:
              raise SystemExit("persisted leakage audit digest differs from qualification")
          print("metadata_only_evidence_generated=true")
          print(f"leakage_audit_sha256={audit_sha256}")

      - name: Verify committed evidence when present
        shell: python
        run: |
          import json
          from pathlib import Path

          generated = Path("${{ runner.temp }}") / "medagentbench-qualification"
          registry = {
              "source_probe.json": Path("registry/medagentbench_source_probe.json"),
              "role_manifest.json": Path("registry/medagentbench_role_manifest.json"),
              "runtime_status.json": Path("registry/medagentbench_runtime_status.json"),
              "leakage_audit.json": Path("registry/medagentbench_leakage_audit.json"),
              "qualification.json": Path("registry/medagentbench_qualification.json"),
          }
          present = [path.exists() for path in registry.values()]
          if any(present) and not all(present):
              raise SystemExit("partial committed MedAgentBench evidence is forbidden")
          if all(present):
              for generated_name, expected_path in registry.items():
                  actual = json.loads((generated / generated_name).read_text(encoding="utf-8"))
                  expected = json.loads(expected_path.read_text(encoding="utf-8"))
                  if actual != expected:
                      raise SystemExit(
                          f"generated evidence differs from registry evidence: {expected_path}"
                      )
              print("registry_evidence_match=true")
          else:
              print("registry_evidence_match=probe-only-no-committed-evidence-yet")

      - name: Upload metadata-only qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: medagentbench-qualification
          path: ${{ runner.temp }}/medagentbench-qualification
          if-no-files-found: error
          retention-days: 7
