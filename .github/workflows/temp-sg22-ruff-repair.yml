name: Temporary SG-000022 exact Ruff repair

on:
  push:
    branches:
      - feat/sg000022-final-evaluation-implementation
    paths:
      - .github/workflows/temp-sg22-ruff-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/sg000022-final-evaluation-implementation
          fetch-depth: 1
      - name: Apply one exact formatting-only replacement and self-delete
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/run_p08_final_evaluation.py")
          text = path.read_text(encoding="utf-8")
          old = '            if confidence >= low and (confidence < high or (index == bins - 1 and confidence <= high))\n'
          new = (
              '            if confidence >= low\n'
              '            and (\n'
              '                confidence < high\n'
              '                or (index == bins - 1 and confidence <= high)\n'
              '            )\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one target line, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")
          PY
          git rm .github/workflows/temp-sg22-ruff-repair.yml
          git diff --check
          git config user.name "dal-governance-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run_p08_final_evaluation.py
          git commit -m "DAL-P08: wrap final evaluation ECE condition"
          git push origin HEAD:feat/sg000022-final-evaluation-implementation
