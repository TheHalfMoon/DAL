name: SG-000023 Provenance Repair

on:
  push:
    branches:
      - feat/sg000023-paper-evidence
    paths:
      - .github/workflows/sg23-provenance-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'TheHalfMoon/DAL' && github.ref == 'refs/heads/feat/sg000023-paper-evidence'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/sg000023-paper-evidence
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded provenance patch
        run: python tools/_repair_sg23_provenance_once.py

      - name: Install pinned Ruff
        run: python -m pip install 'ruff==0.16.10'

      - name: Regenerate and validate
        run: |
          python -m ruff format tools/build_sg000023_paper_evidence.py tests/test_p08_sg000023_paper_evidence.py
          python -m ruff check tools/build_sg000023_paper_evidence.py tests/test_p08_sg000023_paper_evidence.py
          python tools/build_sg000023_paper_evidence.py
          python tools/build_sg000023_paper_evidence.py --check
          python -m pytest -q tests/test_p08_sg000023_paper_evidence.py
          git diff --check

      - name: Commit repaired provenance package
        shell: bash
        run: |
          set -euo pipefail
          git add tools/build_sg000023_paper_evidence.py tests/test_p08_sg000023_paper_evidence.py registry/p08_sg000023_paper_evidence
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DAL-P08: repair SG-000023 evidence packet provenance'
          git push origin HEAD:feat/sg000023-paper-evidence
