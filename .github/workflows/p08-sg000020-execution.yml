name: DAL P08 SG-000020 Calibration and Selection Execution

on:
  pull_request:
    paths:
      - ".github/workflows/p08-sg000020-execution.yml"
      - "registry/p08_calibration_selection_contract_sg000020.json"
      - "registry/p08_calibration_manifest_sg000018.json"
      - "registry/pubmedqa_pqal_split_manifest.json"
      - "registry/p08_development_training_manifest_sg000019.json"
      - "registry/p08_paper_training_contract_sg000019.json"
      - "registry/p08_gax_paper_candidate_seed0_checkpoint_sg000019.json"
      - "scripts/run_p08_sg000020_execution.py"
      - "scripts/run_p08_sg000020_from_checkpoint.py"
      - "src/gaxbench/p08_calibration_execution.py"
      - "src/gaxbench/p08_protocol_selection.py"
      - "src/gaxbench/fhir.py"
      - "src/gaxbench/fhir_agentbench_qualification.py"
      - "src/gaxbench/pubmedqa.py"
      - "tests/test_p08_calibration_execution.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/p08-sg000020-execution.yml"
      - "registry/p08_calibration_selection_contract_sg000020.json"
      - "registry/p08_calibration_manifest_sg000018.json"
      - "registry/pubmedqa_pqal_split_manifest.json"
      - "registry/p08_development_training_manifest_sg000019.json"
      - "registry/p08_paper_training_contract_sg000019.json"
      - "registry/p08_gax_paper_candidate_seed0_checkpoint_sg000019.json"
      - "scripts/run_p08_sg000020_execution.py"
      - "scripts/run_p08_sg000020_from_checkpoint.py"
      - "src/gaxbench/p08_calibration_execution.py"
      - "src/gaxbench/p08_protocol_selection.py"
      - "src/gaxbench/fhir.py"
      - "src/gaxbench/fhir_agentbench_qualification.py"
      - "src/gaxbench/pubmedqa.py"
      - "tests/test_p08_calibration_execution.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  PUBMEDQA_SOURCE_REVISION: 1cbae8e92f72f20c8d3747cbb3bf5bc53554d997
  FHIR_AGENTBENCH_REVISION: bbb42909a5a7eb907d1cd91f72a560729e7037ea
  PHYSIONET_BASE: https://physionet.org/files/mimic-iv-fhir-demo/2.1.0

jobs:
  execute:
    name: SG-000020 real calibration + ECAL/FHIR freeze / CPU
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bootstrap exact frozen SG-000019 checkpoint
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECKPOINT_PATH: registry/p08_gax_paper_candidate_seed0_checkpoint_sg000019.json
          CHECKPOINT_SHA256: 351513742474f71e0758854f15bd02ec1b7097c23a1ca17d05c7e95482e4168b
          ARTIFACT_ID: "11103012765"
          ARTIFACT_ZIP_SHA256: d757bc11841617fe3358351ac15ea31a9cf0b4bc9818de867c8d28b2d43a354b
        run: |
          if [[ -f "$CHECKPOINT_PATH" ]]; then
            echo "canonical checkpoint already present"
            exit 0
          fi
          work="$RUNNER_TEMP/sg000019-checkpoint-bootstrap"
          rm -rf "$work"
          mkdir -p "$work/unpacked"
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output "$work/artifact.zip"
          echo "${ARTIFACT_ZIP_SHA256}  $work/artifact.zip" | sha256sum --check --strict
          unzip -q "$work/artifact.zip" -d "$work/unpacked"
          source_file="$work/unpacked/gax-paper-candidate.seed-0.checkpoint.json"
          echo "${CHECKPOINT_SHA256}  $source_file" | sha256sum --check --strict
          cp "$source_file" "$CHECKPOINT_PATH"
          echo "${CHECKPOINT_SHA256}  $CHECKPOINT_PATH" | sha256sum --check --strict
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CHECKPOINT_PATH"
          git commit -m "DAL-P08: persist frozen SG-000019 seed-0 checkpoint"
          git push origin "HEAD:${{ github.head_ref }}"
          echo "bootstrap committed the exact frozen checkpoint; this run is intentionally stale"
          exit 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install DAL and pinned CPU runtime
        run: |
          python -m pip install -e .
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.8.0"
          python -m pip install \
            "transformers==4.57.1" \
            "safetensors==0.6.2" \
            "huggingface_hub==0.35.3" \
            "tokenizers==0.22.1" \
            "numpy==2.2.6"
      - name: Download exact frozen PubMedQA and FHIR-AgentBench sources
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/sg000020/sources"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/pubmedqa/pubmedqa/${PUBMEDQA_SOURCE_REVISION}/data/ori_pqal.json" \
            --output "$RUNNER_TEMP/sg000020/sources/ori_pqal.json"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/glee4810/FHIR-AgentBench/${FHIR_AGENTBENCH_REVISION}/final_dataset/questions_answers_sql_fhir.csv" \
            --output "$RUNNER_TEMP/sg000020/sources/questions_answers_sql_fhir.csv"
      - name: Download frozen open PhysioNet FHIR demo and official checksums
        shell: bash
        run: |
          work="$RUNNER_TEMP/sg000020/physionet"
          mkdir -p "$work"
          curl --fail --location --retry 3 \
            "${PHYSIONET_BASE}/SHA256SUMS.txt" \
            --output "$work/official-SHA256SUMS.txt"
          python - <<'PY'
          import concurrent.futures
          import hashlib
          import os
          import time
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          root = Path(os.environ["RUNNER_TEMP"]) / "sg000020" / "physionet"
          base = os.environ["PHYSIONET_BASE"].rstrip("/")
          manifest = root / "official-SHA256SUMS.txt"
          entries: list[tuple[str, str]] = []
          for line_number, line in enumerate(manifest.read_text(encoding="utf-8").splitlines(), start=1):
              stripped = line.strip()
              if not stripped:
                  continue
              parts = stripped.split(maxsplit=1)
              if len(parts) != 2:
                  raise SystemExit(f"invalid PhysioNet checksum row {line_number}: {line!r}")
              digest, relative = parts
              relative = relative.lstrip("*").strip()
              if relative.startswith("./"):
                  relative = relative[2:]
              if not relative or ".." in Path(relative).parts:
                  raise SystemExit(f"unsafe PhysioNet path: {relative!r}")
              if len(digest) != 64 or any(char not in "0123456789abcdef" for char in digest):
                  raise SystemExit(f"invalid PhysioNet SHA-256: {digest!r}")
              entries.append((digest, relative))
          if not entries:
              raise SystemExit("PhysioNet checksum manifest is empty")

          def download(entry: tuple[str, str]) -> str:
              digest, relative = entry
              target = root / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              encoded = "/".join(quote(part) for part in Path(relative).parts)
              url = f"{base}/{encoded}"
              last_error: BaseException | None = None
              for attempt in range(1, 4):
                  try:
                      request = Request(url, headers={"User-Agent": "DAL-research/0.1"})
                      with urlopen(request, timeout=120) as response, target.open("wb") as handle:
                          while chunk := response.read(1024 * 1024):
                              handle.write(chunk)
                      actual = hashlib.sha256(target.read_bytes()).hexdigest()
                      if actual != digest:
                          raise RuntimeError(
                              f"PhysioNet SHA-256 mismatch for {relative}: {actual} != {digest}"
                          )
                      return relative
                  except BaseException as error:
                      last_error = error
                      target.unlink(missing_ok=True)
                      if attempt < 3:
                          time.sleep(attempt)
              assert last_error is not None
              raise last_error

          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as executor:
              completed = list(executor.map(download, entries))
          if len(completed) != len(entries):
              raise SystemExit("PhysioNet download coverage incomplete")
          if not (root / "fhir").is_dir():
              raise SystemExit("PhysioNet release did not contain the expected fhir directory")
          print(f"verified {len(completed)} PhysioNet release files from official SHA256SUMS.txt")
          PY
          echo "PHYSIONET_ROOT=$work" >> "$GITHUB_ENV"
          echo "PHYSIONET_SUMS=$work/official-SHA256SUMS.txt" >> "$GITHUB_ENV"
      - name: Resolve exact implementation source revision
        id: source
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Execute frozen SG-000020 protocol
        run: |
          mkdir -p "$RUNNER_TEMP/sg000020/evidence"
          python scripts/run_p08_sg000020_from_checkpoint.py \
            --pubmedqa-source "$RUNNER_TEMP/sg000020/sources/ori_pqal.json" \
            --pubmedqa-split-manifest registry/pubmedqa_pqal_split_manifest.json \
            --development-manifest registry/p08_development_training_manifest_sg000019.json \
            --training-contract registry/p08_paper_training_contract_sg000019.json \
            --fhir-agentbench-csv "$RUNNER_TEMP/sg000020/sources/questions_answers_sql_fhir.csv" \
            --physionet-root "$PHYSIONET_ROOT" \
            --physionet-sha256s "$PHYSIONET_SUMS" \
            --source-revision "${{ steps.source.outputs.sha }}" \
            --output-dir "$RUNNER_TEMP/sg000020/evidence"
      - name: Upload exact SG-000020 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sg000020-calibration-ecal-fhir-${{ steps.source.outputs.sha }}
          path: ${{ runner.temp }}/sg000020/evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Require sealed complete execution
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "sg000020" / "evidence"
          if (root / "failure.json").exists():
              raise SystemExit((root / "failure.json").read_text(encoding="utf-8"))
          summary = json.loads((root / "summary.json").read_text(encoding="utf-8"))
          if summary["paper_checkpoint_reconstruction_verified"] is not True:
              raise SystemExit("frozen paper checkpoint was not loaded and verified exactly")
          if summary["calibration_rows_used"] != 150:
              raise SystemExit("calibration role count drift")
          if summary["fhir_calibration_rows_used"] != 341:
              raise SystemExit("FHIR calibration role count drift")
          if summary["fhir_missing_reference_count"] != 0:
              raise SystemExit("FHIR calibration references were silently unresolved")
          if summary["fhir_requested_reference_count"] != summary["fhir_resolved_reference_count"]:
              raise SystemExit("FHIR requested/resolved reference count mismatch")
          if summary["final_test_rows_used"] != 0 or summary["final_test_access"] != "sealed":
              raise SystemExit("final-test boundary was violated")
          if summary["authorization_can_authorize_inference"] is not False:
              raise SystemExit("SG-000020 authorization candidate became executable")
          if summary["zero_founder_cost"] is not True:
              raise SystemExit("zero-founder-cost boundary drifted")
          print("SG-000020 PASS: calibration + ECAL/FHIR freeze complete; final test sealed")
          PY
