name: DAL P08 SG-000020 Calibration and Selection Execution

on:
  pull_request:
    paths:
      - ".github/workflows/p08-sg000020-execution.yml"
      - "registry/p08_calibration_selection_contract_sg000020.json"
      - "registry/p08_calibration_manifest_sg000018.json"
      - "registry/pubmedqa_pqal_split_manifest.json"
      - "registry/p08_development_training_manifest_sg000019.json"
      - "registry/p08_paper_training_contract_sg000019.json"
      - "scripts/run_p08_sg000020_execution.py"
      - "src/gaxbench/p08_calibration_execution.py"
      - "src/gaxbench/p08_protocol_selection.py"
      - "src/gaxbench/fhir.py"
      - "src/gaxbench/fhir_agentbench_qualification.py"
      - "src/gaxbench/pubmedqa.py"
      - "tests/test_p08_calibration_execution.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/p08-sg000020-execution.yml"
      - "registry/p08_calibration_selection_contract_sg000020.json"
      - "registry/p08_calibration_manifest_sg000018.json"
      - "registry/pubmedqa_pqal_split_manifest.json"
      - "registry/p08_development_training_manifest_sg000019.json"
      - "registry/p08_paper_training_contract_sg000019.json"
      - "scripts/run_p08_sg000020_execution.py"
      - "src/gaxbench/p08_calibration_execution.py"
      - "src/gaxbench/p08_protocol_selection.py"
      - "src/gaxbench/fhir.py"
      - "src/gaxbench/fhir_agentbench_qualification.py"
      - "src/gaxbench/pubmedqa.py"
      - "tests/test_p08_calibration_execution.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p08-sg000020-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  PUBMEDQA_SOURCE_REVISION: 1cbae8e92f72f20c8d3747cbb3bf5bc53554d997
  FHIR_AGENTBENCH_REVISION: bbb42909a5a7eb907d1cd91f72a560729e7037ea
  PHYSIONET_BASE: https://physionet.org/files/mimic-iv-fhir-demo/2.1.0
  PHYSIONET_ZIP: https://physionet.org/content/mimic-iv-fhir-demo/get-zip/2.1.0/

jobs:
  execute:
    name: SG-000020 real calibration + ECAL/FHIR freeze / CPU
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install DAL and pinned CPU runtime
        run: |
          python -m pip install -e .
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.8.0"
          python -m pip install \
            "transformers==4.57.1" \
            "safetensors==0.6.2" \
            "huggingface_hub==0.35.3" \
            "tokenizers==0.22.1" \
            "numpy==2.2.6"
      - name: Download exact frozen PubMedQA and FHIR-AgentBench sources
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/sg000020/sources"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/pubmedqa/pubmedqa/${PUBMEDQA_SOURCE_REVISION}/data/ori_pqal.json" \
            --output "$RUNNER_TEMP/sg000020/sources/ori_pqal.json"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/glee4810/FHIR-AgentBench/${FHIR_AGENTBENCH_REVISION}/final_dataset/questions_answers_sql_fhir.csv" \
            --output "$RUNNER_TEMP/sg000020/sources/questions_answers_sql_fhir.csv"
      - name: Download frozen open PhysioNet FHIR demo and official checksums
        shell: bash
        run: |
          work="$RUNNER_TEMP/sg000020/physionet"
          mkdir -p "$work/extracted"
          curl --fail --location --retry 3 \
            "${PHYSIONET_BASE}/SHA256SUMS.txt" \
            --output "$work/official-SHA256SUMS.txt"
          curl --fail --location --retry 3 \
            "${PHYSIONET_ZIP}" \
            --output "$work/release.zip"
          unzip -q "$work/release.zip" -d "$work/extracted"
          extracted_manifest="$(find "$work/extracted" -type f -name SHA256SUMS.txt -print -quit)"
          if [[ -z "$extracted_manifest" ]]; then
            echo "PhysioNet ZIP did not contain SHA256SUMS.txt" >&2
            exit 1
          fi
          if ! cmp --silent "$work/official-SHA256SUMS.txt" "$extracted_manifest"; then
            echo "PhysioNet ZIP checksum manifest differs from separately fetched official manifest" >&2
            exit 1
          fi
          release_root="$(dirname "$extracted_manifest")"
          if [[ ! -d "$release_root/fhir" ]]; then
            echo "PhysioNet ZIP did not contain the expected fhir directory" >&2
            exit 1
          fi
          echo "PHYSIONET_ROOT=$release_root" >> "$GITHUB_ENV"
          echo "PHYSIONET_SUMS=$work/official-SHA256SUMS.txt" >> "$GITHUB_ENV"
      - name: Resolve exact implementation source revision
        id: source
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Execute frozen SG-000020 protocol
        run: |
          mkdir -p "$RUNNER_TEMP/sg000020/evidence"
          python scripts/run_p08_sg000020_execution.py \
            --pubmedqa-source "$RUNNER_TEMP/sg000020/sources/ori_pqal.json" \
            --pubmedqa-split-manifest registry/pubmedqa_pqal_split_manifest.json \
            --development-manifest registry/p08_development_training_manifest_sg000019.json \
            --training-contract registry/p08_paper_training_contract_sg000019.json \
            --fhir-agentbench-csv "$RUNNER_TEMP/sg000020/sources/questions_answers_sql_fhir.csv" \
            --physionet-root "$PHYSIONET_ROOT" \
            --physionet-sha256s "$PHYSIONET_SUMS" \
            --source-revision "${{ steps.source.outputs.sha }}" \
            --output-dir "$RUNNER_TEMP/sg000020/evidence"
      - name: Upload exact SG-000020 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sg000020-calibration-ecal-fhir-${{ steps.source.outputs.sha }}
          path: ${{ runner.temp }}/sg000020/evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Require sealed complete execution
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "sg000020" / "evidence"
          if (root / "failure.json").exists():
              raise SystemExit((root / "failure.json").read_text(encoding="utf-8"))
          summary = json.loads((root / "summary.json").read_text(encoding="utf-8"))
          if summary["paper_checkpoint_reconstruction_verified"] is not True:
              raise SystemExit("frozen paper checkpoint was not reproduced exactly")
          if summary["calibration_rows_used"] != 150:
              raise SystemExit("calibration role count drift")
          if summary["fhir_calibration_rows_used"] != 341:
              raise SystemExit("FHIR calibration role count drift")
          if summary["fhir_missing_reference_count"] != 0:
              raise SystemExit("FHIR calibration references were silently unresolved")
          if summary["fhir_requested_reference_count"] != summary["fhir_resolved_reference_count"]:
              raise SystemExit("FHIR requested/resolved reference count mismatch")
          if summary["final_test_rows_used"] != 0 or summary["final_test_access"] != "sealed":
              raise SystemExit("final-test boundary was violated")
          if summary["authorization_can_authorize_inference"] is not False:
              raise SystemExit("SG-000020 authorization candidate became executable")
          if summary["zero_founder_cost"] is not True:
              raise SystemExit("zero-founder-cost boundary drifted")
          print("SG-000020 PASS: calibration + ECAL/FHIR freeze complete; final test sealed")
          PY
