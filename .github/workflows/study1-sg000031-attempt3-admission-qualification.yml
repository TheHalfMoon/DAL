name: DAL R2 Attempt-3 admission engineering (UNARMED / NO DISPATCH)

on:
  pull_request:
    paths:
      - registry/study1_sg000031_attempt3_admission_contract.json
      - src/gaxbench/study1_attempt3_admission.py
      - tools/study1_sg000031_attempt3_admission.py
      - tools/qualify_sg000031_attempt3_admission.py
      - tests/test_study1_sg000031_attempt3_admission.py
      - .github/workflows/study1-sg000031-attempt3-admission-qualification.yml
      - docs/study1-sg000031-attempt3-admission.md
  push:
    branches: [main]
    paths:
      - registry/study1_sg000031_attempt3_admission_contract.json
      - src/gaxbench/study1_attempt3_admission.py
      - tools/study1_sg000031_attempt3_admission.py
      - tools/qualify_sg000031_attempt3_admission.py
      - tests/test_study1_sg000031_attempt3_admission.py
      - .github/workflows/study1-sg000031-attempt3-admission-qualification.yml
      - docs/study1-sg000031-attempt3-admission.md

permissions:
  contents: read

concurrency:
  group: dal-attempt3-admission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  native-admission:
    name: Attempt-3 read-only unarmed admission
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install deterministic qualification dependencies
        run: python -m pip install -e '.[dev]'
      - name: Exercise synthetic admission and negative gates
        run: python -m pytest tests/test_study1_sg000031_attempt3_admission.py -q
      - name: Execute local synthetic admission rehearsal (zero science)
        run: >-
          python tools/study1_sg000031_attempt3_admission.py
          --rehearse --output "$RUNNER_TEMP/attempt3-admission-rehearsal.json"
      - name: Qualify frozen history, current GitHub identity, and authorization read-only
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          python tools/qualify_sg000031_attempt3_admission.py
          --output "$RUNNER_TEMP/attempt3-admission-qualification.json"
      - name: Retain native, hash-verifiable admission evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sg000031-attempt3-unarmed-admission-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/attempt3-admission-rehearsal.json
            ${{ runner.temp }}/attempt3-admission-qualification.json
          if-no-files-found: error
          retention-days: 30
