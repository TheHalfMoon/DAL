name: GAX P08 MedQAbstain Qualification

on:
  pull_request:
    paths:
      - ".github/workflows/p08-medqabstain-qualification.yml"
      - ".specgrain/specs/SG-000017.json"
      - "src/gaxbench/medqabstain_probe.py"
      - "tests/test_medqabstain_probe.py"
      - "docs/datasets/MEDQABSTAIN.md"
      - "registry/medqabstain_*.json"
      - "registry/p08_real_inventory.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/p08-medqabstain-qualification.yml"
      - ".specgrain/specs/SG-000017.json"
      - "src/gaxbench/medqabstain_probe.py"
      - "tests/test_medqabstain_probe.py"
      - "docs/datasets/MEDQABSTAIN.md"
      - "registry/medqabstain_*.json"
      - "registry/p08_real_inventory.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Frozen MedQAbstain Hugging Face metadata probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Download immutable-revision metadata source
        run: |
          curl --fail --location --silent --show-error \
            "https://huggingface.co/api/datasets/disi-unibo-nlp/MedQAbstain?blobs=true" \
            --output /tmp/medqabstain-hub.json
      - name: Generate metadata-only immutable identity probe
        run: |
          mkdir -p /tmp/medqabstain-evidence
          python -m gaxbench.medqabstain_probe \
            --metadata /tmp/medqabstain-hub.json \
            --output /tmp/medqabstain-evidence/medqabstain_hub_probe.json
      - name: Verify committed probe when frozen
        run: |
          if [ -f registry/medqabstain_hub_probe.json ]; then
            diff -u registry/medqabstain_hub_probe.json \
              /tmp/medqabstain-evidence/medqabstain_hub_probe.json
          else
            echo "Probe stage: committed freeze evidence does not exist yet."
          fi
      - name: Upload metadata-only probe
        uses: actions/upload-artifact@v4
        with:
          name: medqabstain-hub-probe
          path: /tmp/medqabstain-evidence/medqabstain_hub_probe.json
          if-no-files-found: error
          retention-days: 7
