name: DAL P08 Paper Candidate Training Qualification

on:
  pull_request:
    paths:
      - ".github/workflows/p08-paper-training-qualification.yml"
      - "registry/p08_development_training_manifest_sg000019.json"
      - "registry/p08_paper_training_contract_sg000019.json"
      - "registry/p08_required_model_revisions_sg000019.json"
      - "scripts/run_p08_paper_training.py"
      - "scripts/run_p08_d03_assurance.py"
      - "src/gaxbench/p08_paper_models.py"
      - "src/gaxbench/p08_real_systems.py"
      - "src/gaxbench/p08_system_qualification.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/p08-paper-training-qualification.yml"
      - "registry/p08_development_training_manifest_sg000019.json"
      - "registry/p08_paper_training_contract_sg000019.json"
      - "registry/p08_required_model_revisions_sg000019.json"
      - "scripts/run_p08_paper_training.py"
      - "scripts/run_p08_d03_assurance.py"
      - "src/gaxbench/p08_paper_models.py"
      - "src/gaxbench/p08_real_systems.py"
      - "src/gaxbench/p08_system_qualification.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  PUBMEDQA_SOURCE_REVISION: 1cbae8e92f72f20c8d3747cbb3bf5bc53554d997

jobs:
  train-and-qualify:
    name: Matched DAL paper candidate + clinical control / CPU
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install DAL and pinned CPU runtime
        run: |
          python -m pip install -e .
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.8.0"
          python -m pip install \
            "transformers==4.57.1" \
            "safetensors==0.6.2" \
            "huggingface_hub==0.35.3" \
            "tokenizers==0.22.1" \
            "numpy==2.2.6"
      - name: Download exact frozen PubMedQA PQA-L source
        run: |
          mkdir -p "$RUNNER_TEMP/sg000019-paper"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/pubmedqa/pubmedqa/${PUBMEDQA_SOURCE_REVISION}/data/ori_pqal.json" \
            --output "$RUNNER_TEMP/sg000019-paper/ori_pqal.json"
      - name: Resolve exact implementation source revision
        id: source
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Train and qualify both required trainable systems
        run: |
          python scripts/run_p08_d03_assurance.py \
            --source "$RUNNER_TEMP/sg000019-paper/ori_pqal.json" \
            --development-manifest registry/p08_development_training_manifest_sg000019.json \
            --training-contract registry/p08_paper_training_contract_sg000019.json \
            --source-revision "${{ steps.source.outputs.sha }}" \
            --output-dir "$RUNNER_TEMP/sg000019-paper/evidence"
      - name: Upload exact training and qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sg000019-paper-candidate-clinical-control
          path: ${{ runner.temp }}/sg000019-paper/evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Require complete final-development qualification
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from gaxbench.p08_system_qualification import load_qualification_bundle

          root = Path(os.environ["RUNNER_TEMP"]) / "sg000019-paper" / "evidence"
          summary = json.loads((root / "summary.json").read_text(encoding="utf-8"))
          if summary["architecture_search_boundary"] != "D03-final-development-candidate":
              raise SystemExit("D03 final architecture-search boundary drifted")
          if summary["architecture_search_closed_after_d03"] is not True:
              raise SystemExit("D03 did not close adaptive architecture search")
          if summary["final_test_access"] != "sealed":
              raise SystemExit("final-test access changed during SG-000019 training")
          if summary["calibration_rows_used"] != 0 or summary["final_test_rows_used"] != 0:
              raise SystemExit("forbidden calibration/final-test rows were used")

          for system_id in ("gax-paper-candidate", "clinical-encoder"):
              bundle = load_qualification_bundle(
                  root / f"{system_id}.qualification-bundle.json"
              )
              if [execution.training_seed for execution in bundle.executions] != [0, 1, 2]:
                  raise SystemExit(f"{system_id} execution seeds drifted")
              if len(bundle.checkpoints) != 3 or len(bundle.executions) != 3:
                  raise SystemExit(f"{system_id} is missing three-seed evidence")
              if any(execution.failures.total() for execution in bundle.executions):
                  raise SystemExit(f"{system_id} contains hidden execution failures")

          paper = summary["systems"]["gax-paper-candidate"]
          control = summary["systems"]["clinical-encoder"]
          if summary["paper_action_equivalence_verified"] is not True:
              raise SystemExit("paper action distribution is not control-equivalent")
          if summary["paper_selected_seed_matches_control"] is not True:
              raise SystemExit("paper selected seed does not match the frozen control seed")
          if paper["selected_seed"] != control["selected_seed"]:
              raise SystemExit("paper/control selected seed mismatch")
          if summary["paper_selected_critic_nll_nondegradation"] is not True:
              raise SystemExit("selected shadow critic degrades matched-control NLL")
          if summary["paper_selected_sufficiency_brier_accepted"] is not True:
              raise SystemExit("selected sufficiency Brier exceeds frozen ceiling")
          if summary["paper_development_decision"] != "accepted":
              raise SystemExit("D03 final development candidate was rejected")

          selected_seed = paper["selected_seed"]
          paper_row = next(row for row in paper["seeds"] if row["seed"] == selected_seed)
          control_row = next(
              row for row in control["seeds"] if row["seed"] == selected_seed
          )
          if paper_row["action_nll"] != control_row["action_nll"]:
              raise SystemExit("selected paper action NLL drifted from matched control")
          if paper_row["accuracy"] != control_row["accuracy"]:
              raise SystemExit("selected paper accuracy drifted from matched control")
          if any(not row["action_equivalent_to_control"] for row in paper["seeds"]):
              raise SystemExit("at least one paper seed changed the control action output")

          print(
              "SG-000019 D03 PASS: exact control-equivalent action path, "
              "non-degrading shadow critic, accepted sufficiency, 2 systems x 3 seeds"
          )
          PY
