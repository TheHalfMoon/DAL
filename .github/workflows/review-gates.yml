name: DAL Review Gates

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dal-review-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ocr-delegation:
    name: Alibaba OCR Delegation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OCR_BIN: /tmp/dal-ocr
      OCR_OUT: /tmp/dal-ocr-output
      OCR_URL: https://github.com/alibaba/open-code-review/releases/download/v1.12.9/opencodereview-linux-amd64
      OCR_SHA256: 9105c7081b8362a1cb0167f1ddfd1437e147a0e3c9a5af89c03c8859a5b0f0e8
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Install checksum-pinned Alibaba OpenCodeReview
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$OCR_URL" --output "$OCR_BIN"
          echo "$OCR_SHA256  $OCR_BIN" | sha256sum --check --status
          chmod 700 "$OCR_BIN"
          mkdir -m 700 "$OCR_OUT"
          "$OCR_BIN" --version
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact PR range and generate OCR delegation evidence
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" = "$BASE_SHA"
          git diff --check "$BASE_SHA" "$HEAD_SHA"

          "$OCR_BIN" delegate preview --format json --from "$BASE_SHA" --to "$HEAD_SHA" \
            | tee "$OCR_OUT/ocr-preview.json"

          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess

          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]
          out = os.environ["OCR_OUT"]
          with open(out + "/ocr-preview.json", encoding="utf-8") as handle:
              preview = json.load(handle)

          if preview.get("from") != base or preview.get("to") != head:
              raise SystemExit("OCR preview does not bind the exact PR range")
          if preview.get("merge_base") != base:
              raise SystemExit("OCR preview merge base does not match PR base")

          files = []
          for entry in preview.get("reviewable_files", []):
              path = entry.get("path") if isinstance(entry, dict) else entry
              if not isinstance(path, str) or not path or path.startswith("-") or "\x00" in path:
                  raise SystemExit("OCR returned an invalid reviewable path")
              files.append(path)

          rules = {"groups": []}
          if files:
              completed = subprocess.run(
                  [os.environ["OCR_BIN"], "delegate", "rule", "--format", "json", "--", *files],
                  check=True,
                  text=True,
                  stdout=subprocess.PIPE,
              )
              rules = json.loads(completed.stdout)

          encoded = json.dumps(rules, sort_keys=True, separators=(",", ":")).encode()
          evidence = {
              "schema_version": "1",
              "tool": "alibaba/open-code-review@v1.12.9",
              "base_sha": base,
              "head_sha": head,
              "total_files": preview.get("total_files"),
              "reviewable_count": preview.get("reviewable_count"),
              "excluded_count": preview.get("excluded_count"),
              "reviewable_files": files,
              "rule_groups": len(rules.get("groups", [])),
              "rules_sha256": hashlib.sha256(encoded).hexdigest(),
              "mode": "delegation-accounting",
          }
          with open(out + "/ocr-evidence.json", "w", encoding="utf-8") as handle:
              json.dump(evidence, handle, indent=2, sort_keys=True)
              handle.write("\n")
          with open(out + "/ocr-rules.json", "w", encoding="utf-8") as handle:
              json.dump(rules, handle, indent=2, sort_keys=True)
              handle.write("\n")
          print(
              f"OCR exact-range evidence: {evidence['reviewable_count']} reviewable, "
              f"{evidence['excluded_count']} excluded"
          )
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dal-ocr-delegation-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/dal-ocr-output/ocr-preview.json
            /tmp/dal-ocr-output/ocr-rules.json
            /tmp/dal-ocr-output/ocr-evidence.json
          if-no-files-found: error
          retention-days: 14
