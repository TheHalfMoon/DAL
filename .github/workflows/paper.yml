name: DAL Manuscript

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dal-manuscript-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manuscript:
    name: Manuscript clean-room build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Rebuild frozen evidence package and manuscript inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_sg000023_paper_evidence.py --check
          python3 tools/build_sg000024_manuscript_inputs.py --check

      - name: Install signature-verified TeX Live packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-pictures texlive-fonts-recommended

      - name: Compile manuscript
        shell: bash
        working-directory: paper
        run: |
          set -euo pipefail
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex

      - name: Fail on undefined references or citations
        shell: bash
        working-directory: paper
        run: |
          set -euo pipefail
          if grep -E "LaTeX Warning: (Reference|Citation) .* undefined|There were undefined references" main.log; then
            echo "undefined references or citations"
            exit 1
          fi
          sha256sum main.pdf

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dal-manuscript-pdf
          path: paper/main.pdf
          retention-days: 30
