name: DAL Manuscript

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dal-manuscript-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manuscript:
    name: Manuscript clean-room build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Rebuild frozen evidence package and manuscript inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_sg000023_paper_evidence.py --check
          python3 tools/build_sg000024_manuscript_inputs.py --check
          python3 tools/build_sg000024_release_docs.py --check

      - name: Install signature-verified TeX Live packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-pictures texlive-fonts-recommended lmodern

      - name: Compile manuscript
        shell: bash
        working-directory: paper
        run: |
          set -euo pipefail
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex

      - name: Fail on undefined references or citations
        shell: bash
        working-directory: paper
        run: |
          set -euo pipefail
          if grep -E "LaTeX Warning: (Reference|Citation) .* undefined|There were undefined references" main.log; then
            echo "undefined references or citations"
            exit 1
          fi
          sha256sum main.pdf

      - name: Assemble deterministic arXiv source bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf arxiv-src && mkdir -p arxiv-src/generated
          cp paper/main.tex paper/main.bbl arxiv-src/
          cp paper/generated/*.tex arxiv-src/generated/
          (cd arxiv-src && find . -type f | LC_ALL=C sort > ../arxiv-files.txt)
          tar -C arxiv-src --sort=name --mtime='2026-01-01 00:00:00Z' --owner=0 --group=0 --numeric-owner \
            -cf dal-arxiv-source.tar -T arxiv-files.txt
          gzip -n -9 dal-arxiv-source.tar
          cat arxiv-files.txt
          sha256sum dal-arxiv-source.tar.gz

      - name: Verify arXiv bundle compiles standalone without BibTeX
        shell: bash
        run: |
          set -euo pipefail
          rm -rf arxiv-check && mkdir arxiv-check
          tar -xzf dal-arxiv-source.tar.gz -C arxiv-check
          cd arxiv-check
          for pass in 1 2; do pdflatex -interaction=nonstopmode -halt-on-error main.tex > /dev/null; done
          if grep -E "LaTeX Warning: (Reference|Citation) .* undefined|There were undefined references" main.log; then
            echo "standalone arXiv build has undefined references or citations"
            exit 1
          fi
          grep -E "Output written on main.pdf" main.log

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dal-manuscript-pdf
          path: paper/main.pdf
          retention-days: 30

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dal-arxiv-source
          path: dal-arxiv-source.tar.gz
          retention-days: 90
