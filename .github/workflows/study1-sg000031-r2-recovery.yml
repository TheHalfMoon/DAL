name: DAL Study 1 SG-000031 R2 Recovery

on:
  workflow_dispatch:
    inputs:
      qualification_comment_id:
        description: Exact canonical R2 runner qualification receipt in Issue 158
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: dal-r2-issue158-single-attempt
  cancel-in-progress: false

jobs:
  admission:
    name: Qualify and permanently claim the sole R2 attempt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      pull-requests: read
      issues: read
    outputs:
      claim_sha: ${{ steps.claim.outputs.claim_sha }}
      claimed: ${{ steps.claim.outputs.claimed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install DAL
        run: python -m pip install -e .
      - name: Verify full canonical qualification and atomically claim one attempt
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/study1_sg000031_r2_admission.py admit
          --comment-id "${{ inputs.qualification_comment_id }}"
          --output-dir "$RUNNER_TEMP/sg000031/admission"
      - name: Freeze all 1463 development identities without final content access
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/study1_sg000031_r2_admission.py plan --claim-sha "${{ steps.claim.outputs.claim_sha }}" --output-dir "$RUNNER_TEMP/sg000031/admission"
      - name: Retain admission and infrastructure failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sg000031-r2-admission-${{ github.run_id }}
          path: ${{ runner.temp }}/sg000031/admission/
          if-no-files-found: warn
          retention-days: 30

  shard-0:
    needs: [admission]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/study1-sg000031-r2-worker.yml
    with:
      shard: 0
      claim_sha: ${{ needs.admission.outputs.claim_sha }}

  shard-1:
    needs: [admission, shard-0]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/study1-sg000031-r2-worker.yml
    with:
      shard: 1
      claim_sha: ${{ needs.admission.outputs.claim_sha }}

  shard-2:
    needs: [admission, shard-1]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/study1-sg000031-r2-worker.yml
    with:
      shard: 2
      claim_sha: ${{ needs.admission.outputs.claim_sha }}

  shard-3:
    needs: [admission, shard-2]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/study1-sg000031-r2-worker.yml
    with:
      shard: 3
      claim_sha: ${{ needs.admission.outputs.claim_sha }}

  shard-4:
    needs: [admission, shard-3]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/study1-sg000031-r2-worker.yml
    with:
      shard: 4
      claim_sha: ${{ needs.admission.outputs.claim_sha }}

  shard-5:
    needs: [admission, shard-4]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/study1-sg000031-r2-worker.yml
    with:
      shard: 5
      claim_sha: ${{ needs.admission.outputs.claim_sha }}

  shard-6:
    needs: [admission, shard-5]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/study1-sg000031-r2-worker.yml
    with:
      shard: 6
      claim_sha: ${{ needs.admission.outputs.claim_sha }}

  shard-7:
    needs: [admission, shard-6]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/study1-sg000031-r2-worker.yml
    with:
      shard: 7
      claim_sha: ${{ needs.admission.outputs.claim_sha }}

  aggregate:
    name: Preserve complete R2 denominator and scientific classification
    needs: [admission, shard-0, shard-1, shard-2, shard-3, shard-4, shard-5, shard-6, shard-7]
    if: ${{ always() && needs.admission.outputs.claimed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install DAL
        run: python -m pip install -e .
      - name: Fetch permanent hash-only attempt ledger without inference
        run: git fetch origin refs/heads/codex/sg000031-r2-attempt1-journal:refs/remotes/origin/codex/sg000031-r2-attempt1-journal
      - name: Download all available immutable partial or complete evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: sg000031-r2-*-${{ github.run_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/sg000031/evidence
      - name: Classify scientifically and retain every planned row
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/study1_sg000031_r2_aggregate.py
          --input-dir "$RUNNER_TEMP/sg000031/evidence"
          --output-dir "$RUNNER_TEMP/sg000031/aggregate"
          --claim-sha "${{ needs.admission.outputs.claim_sha }}"
      - name: Upload R2 accounting separately from immutable SG-000028
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sg000031-r2-aggregate-${{ github.run_id }}
          path: ${{ runner.temp }}/sg000031/aggregate/
          if-no-files-found: warn
          retention-days: 30
