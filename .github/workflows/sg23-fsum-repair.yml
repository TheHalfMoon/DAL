name: SG-000023 Cross-Version Float Reproducibility Repair

on:
  push:
    branches:
      - feat/sg000023-paper-evidence
    paths:
      - .github/workflows/sg23-fsum-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'TheHalfMoon/DAL' && github.ref == 'refs/heads/feat/sg000023-paper-evidence'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/sg000023-paper-evidence
          fetch-depth: 0
          persist-credentials: true

      - name: Replace version-sensitive float aggregation with math.fsum
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/build_sg000023_paper_evidence.py')
          text = path.read_text(encoding='utf-8')
          old_mean = 'mean_confidence = sum(item[0] for item in members) / len(members)'
          new_mean = 'mean_confidence = math.fsum(item[0] for item in members) / len(members)'
          old_aurc = 'computed_aurc = sum(point["risk"] for point in points) / len(points)'
          new_aurc = 'computed_aurc = math.fsum(point["risk"] for point in points) / len(points)'
          if old_mean not in text or old_aurc not in text:
              raise SystemExit('expected version-sensitive aggregation sites not found')
          text = text.replace(old_mean, new_mean).replace(old_aurc, new_aurc)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Regenerate deterministic artifacts
        run: |
          python tools/build_sg000023_paper_evidence.py
          python tools/build_sg000023_paper_evidence.py --check
          git diff --check

      - name: Commit bounded reproducibility repair
        shell: bash
        run: |
          set -euo pipefail
          git add tools/build_sg000023_paper_evidence.py registry/p08_sg000023_paper_evidence
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DAL-P08: stabilize SG-000023 float aggregation across Python versions'
          git push origin HEAD:feat/sg000023-paper-evidence
