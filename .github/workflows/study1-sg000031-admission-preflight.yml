name: DAL R2 native admission preflight

on:
  pull_request:
    paths:
      - scripts/study1_sg000031_r2_admission.py
      - tools/qualify_sg000031_admission.py
      - tests/test_study1_sg000031_admission_repair.py
      - .github/workflows/study1-sg000031-admission-preflight.yml
      - registry/study1_sg000031_admission_repair*.json
  push:
    branches: [main]
    paths:
      - scripts/study1_sg000031_r2_admission.py
      - tools/qualify_sg000031_admission.py
      - tests/test_study1_sg000031_admission_repair.py
      - .github/workflows/study1-sg000031-admission-preflight.yml
      - registry/study1_sg000031_admission_repair*.json

permissions:
  contents: read

jobs:
  native-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Match the real admission job's token context. The shared native preflight
    # guard prohibits every REST mutation; GraphQL permits only a fixed read query.
    permissions:
      contents: write
      actions: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install DAL with regression tooling
        run: python -m pip install -e '.[dev]'
      - name: Reproduce retained URL failure and verify fail-closed native regressions
        run: python -m pytest tests/test_study1_sg000031_admission_repair.py
      - name: Qualify actual native authenticated read-only admission path
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python tools/qualify_sg000031_admission.py
          --output "$RUNNER_TEMP/native-admission-preflight.json"
      - name: Retain actual native qualification without inference
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sg000031-native-admission-${{ github.run_id }}
          path: ${{ runner.temp }}/native-admission-preflight.json
          if-no-files-found: error
          retention-days: 30
