name: DAL R2 Attempt-2 native admission qualification

on:
  pull_request:
    paths:
      - scripts/study1_sg000031_r2_admission.py
      - scripts/study1_sg000031_attempt2_admission.py
      - tools/qualify_sg000031_attempt2_admission.py
      - tests/test_study1_sg000031_attempt2_admission.py
      - registry/study1_sg000031_attempt2_*.json
      - .github/workflows/study1-sg000031-r2-attempt2*.yml
      - .github/workflows/study1-sg000031-attempt2-admission-preflight.yml
  push:
    branches: [main]
    paths:
      - scripts/study1_sg000031_r2_admission.py
      - scripts/study1_sg000031_attempt2_admission.py
      - tools/qualify_sg000031_attempt2_admission.py
      - tests/test_study1_sg000031_attempt2_admission.py
      - registry/study1_sg000031_attempt2_*.json
      - .github/workflows/study1-sg000031-r2-attempt2*.yml
      - .github/workflows/study1-sg000031-attempt2-admission-preflight.yml
  workflow_dispatch:
    inputs:
      qualification_comment_id:
        description: Verify a published canonical Attempt-2 receipt read-only; never admit execution
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dal-attempt2-admission-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  native-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Parity with scientific admission token context. The actual native context
    # guard forbids every REST mutation and permits only the fixed GraphQL read.
    permissions:
      contents: write
      actions: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install DAL and deterministic regression tooling
        run: python -m pip install -e '.[dev]'
      - name: Verify versioned admission identities without inference
        run: python -m pytest tests/test_study1_sg000031_attempt2_admission.py
      - name: Qualify actual native authenticated read-only admission
        env:
          GH_TOKEN: ${{ github.token }}
          DAL_R2_ATTEMPT_ORDINAL: "2"
          EXPECTED_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          QUALIFICATION_COMMENT_ID: ${{ inputs.qualification_comment_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            python tools/qualify_sg000031_attempt2_admission.py \
              --comment-id "$QUALIFICATION_COMMENT_ID" \
              --output "$RUNNER_TEMP/attempt2-native-admission-preflight.json"
          else
            python tools/qualify_sg000031_attempt2_admission.py \
              --output "$RUNNER_TEMP/attempt2-native-admission-preflight.json"
          fi
      - name: Retain actual native qualification with zero model calls
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sg000031-attempt2-native-admission-${{ github.run_id }}
          path: ${{ runner.temp }}/attempt2-native-admission-preflight.json
          if-no-files-found: error
          retention-days: 30
