name: DAL P08 SG-000022 Exact Evidence Promotion

on:
  push:
    branches:
      - feat/sg000022-final-evidence-promotion
    paths:
      - .github/workflows/p08-sg000022-promote-evidence.yml

permissions:
  actions: read
  contents: write

jobs:
  promote:
    name: Promote exact qualified artifact bytes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_RUN_ID: "36886952302"
      SOURCE_HEAD_SHA: "f1955d5beeb2444f1d604626629036196a1dedd5"
      SOURCE_ARTIFACT_ID: "11176566473"
      SOURCE_ARTIFACT_NAME: "sg000022-final-evaluation-f1955d5beeb2444f1d604626629036196a1dedd5"
      SOURCE_ARTIFACT_DIGEST: "sha256:8dcd894be6ae184aaf5311417d268a5500b89d0d78d14ee7a79305fbb3071136"
      DESTINATION: "registry/p08_sg000022_final_evaluation"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Verify immutable source run and artifact identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" != "feat/sg000022-final-evidence-promotion" ]]; then
            echo "unexpected promotion branch" >&2
            exit 1
          fi
          if [[ "${GITHUB_RUN_ATTEMPT}" != "1" ]]; then
            echo "promotion workflow reruns are not accepted as evidence" >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > "$RUNNER_TEMP/source-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}" > "$RUNNER_TEMP/source-artifact.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run = json.loads((Path(os.environ["RUNNER_TEMP"]) / "source-run.json").read_text())
          artifact = json.loads((Path(os.environ["RUNNER_TEMP"]) / "source-artifact.json").read_text())
          expected_run = int(os.environ["SOURCE_RUN_ID"])
          if run["id"] != expected_run or run["head_sha"] != os.environ["SOURCE_HEAD_SHA"]:
              raise SystemExit("source run identity drift")
          if run["status"] != "completed" or run["conclusion"] != "success" or run["run_attempt"] != 1:
              raise SystemExit("source run is not the single successful authorized execution")
          if artifact["id"] != int(os.environ["SOURCE_ARTIFACT_ID"]):
              raise SystemExit("artifact id drift")
          if artifact["name"] != os.environ["SOURCE_ARTIFACT_NAME"]:
              raise SystemExit("artifact name drift")
          if artifact.get("digest") != os.environ["SOURCE_ARTIFACT_DIGEST"]:
              raise SystemExit("artifact archive digest drift")
          if artifact.get("expired") is not False:
              raise SystemExit("source artifact is expired")
          workflow_run = artifact.get("workflow_run") or {}
          if workflow_run.get("id") != expected_run or workflow_run.get("head_sha") != os.environ["SOURCE_HEAD_SHA"]:
              raise SystemExit("artifact/run binding drift")
          print("source run and artifact identity PASS")
          PY
      - name: Download and verify exact evidence bytes
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/sg000022-promotion"
          mkdir -p "$work/download"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$SOURCE_ARTIFACT_NAME" --dir "$work/download"
          cd "$work/download"
          cat > "$work/SHA256SUMS" <<'EOF'
          da2e41e7ecda10c2f7dad60b28ad386e160f028b58f76414d7645512633161db  metrics.json
          b8cb7b96241568f7089291614c2157a2656141be16297b0b81791c6cd71893eb  raw-fhir-interface-block.json
          009831a7a404f8cfc44ea83b13d0ecf8d6e9fb4bdd6c511c2835ec2595a69102  raw-laya-pubmedqa-predictions.json
          5f6b593396dd426eee479bec0aaaadba90e0e44b4ef3e55266ba8c7c702ba8da  raw-native-abstention-predictions.json
          402c655da798085d68fa54fbcd63c140a0c0cea389113b684315fcbd1e9fbed9  raw-pubmedqa-predictions.json
          49b9f84830afed365b45c4e23f7ff38e5894c990f0af1cd26bf8160612aa0426  summary.json
          EOF
          sha256sum --check "$work/SHA256SUMS"
          mkdir -p "$GITHUB_WORKSPACE/$DESTINATION"
          cp metrics.json raw-fhir-interface-block.json raw-laya-pubmedqa-predictions.json raw-native-abstention-predictions.json raw-pubmedqa-predictions.json summary.json "$GITHUB_WORKSPACE/$DESTINATION/"
          cd "$GITHUB_WORKSPACE/$DESTINATION"
          sha256sum --check "$work/SHA256SUMS"
      - name: Commit exact evidence bytes to the promotion branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DESTINATION"
          if git diff --cached --quiet; then
            echo "no promotion changes found" >&2
            exit 1
          fi
          git commit -m "DAL-P08: promote exact SG-000022 final evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"
