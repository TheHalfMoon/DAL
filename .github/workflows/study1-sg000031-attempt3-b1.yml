name: DAL R2 Attempt-3 Gate B1 scientific-capability engineering (UNARMED)

on:
  pull_request:
    paths:
      - registry/study1_sg000031_attempt3_b1_contract.json
      - registry/study1_sg000031_attempt3_b1_durable_contract.json
      - src/gaxbench/study1_attempt3_b1.py
      - src/gaxbench/study1_attempt3_b1_durable.py
      - tools/study1_sg000031_attempt3_b1.py
      - tools/qualify_sg000031_attempt3_b1.py
      - tools/qualify_sg000031_attempt3_b1_durable.py
      - tests/test_study1_sg000031_attempt3_b1.py
      - tests/test_study1_sg000031_attempt3_b1_durable.py
      - docs/study1-sg000031-attempt3-b1.md
      - docs/study1-sg000031-attempt3-b1-durable.md
      - .github/workflows/study1-sg000031-attempt3-b1.yml
  push:
    branches: [main]
    paths:
      - registry/study1_sg000031_attempt3_b1_contract.json
      - registry/study1_sg000031_attempt3_b1_durable_contract.json
      - src/gaxbench/study1_attempt3_b1.py
      - src/gaxbench/study1_attempt3_b1_durable.py
      - tools/study1_sg000031_attempt3_b1.py
      - tools/qualify_sg000031_attempt3_b1.py
      - tools/qualify_sg000031_attempt3_b1_durable.py
      - tests/test_study1_sg000031_attempt3_b1.py
      - tests/test_study1_sg000031_attempt3_b1_durable.py
      - docs/study1-sg000031-attempt3-b1.md
      - docs/study1-sg000031-attempt3-b1-durable.md
      - .github/workflows/study1-sg000031-attempt3-b1.yml

permissions:
  contents: read

concurrency:
  group: dal-r2-attempt3-b1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  unarmed-b1:
    name: Gate B1 native read-only science-capability qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install exact project and synthetic-test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Fail-closed synthetic B1 and historical protections
        run: >-
          python -m pytest -q
          tests/test_study1_sg000031_attempt3_b1.py
          tests/test_study1_sg000031_attempt3_b1_durable.py
          tests/test_study1_sg000031_attempt3_admission.py
          tests/test_study1_sg000031_attempt3_readiness.py
      - name: Prove synthetic one-shot claim and frozen worker plan without inference
        run: >-
          python tools/study1_sg000031_attempt3_b1.py
          --rehearse --output "$RUNNER_TEMP/attempt3-b1-synthetic.json"
      - name: Native authenticated read-only founder, provenance and Git qualification
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          python tools/qualify_sg000031_attempt3_b1_durable.py
          --output "$RUNNER_TEMP/attempt3-b1-native.json"
      - name: Retain B1 no-science engineering artifacts with GitHub digest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sg000031-b1-unarmed-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/attempt3-b1-synthetic.json
            ${{ runner.temp }}/attempt3-b1-native.json
          if-no-files-found: error
          retention-days: 30
