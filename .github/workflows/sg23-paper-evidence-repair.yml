name: SG-000023 Paper Evidence Lint Repair

on:
  push:
    branches:
      - feat/sg000023-paper-evidence
    paths:
      - .github/workflows/sg23-paper-evidence-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'TheHalfMoon/DAL' && github.ref == 'refs/heads/feat/sg000023-paper-evidence'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/sg000023-paper-evidence
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded lint repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/build_sg000023_paper_evidence.py')
          text = path.read_text(encoding='utf-8')
          if not text.startswith('# ruff: noqa: E501\n'):
              text = '# ruff: noqa: E501\n' + text
          text = text.replace(
              'from typing import Any, Callable\n',
              'from collections.abc import Callable\nfrom typing import Any\n',
          )
          text = text.replace(
              '        def pubmed_payload(row: dict[str, Any]) -> dict[str, Any]:\n',
              '        def pubmed_payload(\n'
              '            row: dict[str, Any], stratum_id: str = stratum_id\n'
              '        ) -> dict[str, Any]:\n',
          )
          text = text.replace(
              '        def native_payload(row: dict[str, Any]) -> dict[str, Any]:\n',
              '        def native_payload(\n'
              '            row: dict[str, Any], stratum_id: str = stratum_id\n'
              '        ) -> dict[str, Any]:\n',
          )
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Install pinned Ruff
        run: python -m pip install 'ruff==0.16.10'

      - name: Format and validate repair
        run: |
          python -m ruff format tools/build_sg000023_paper_evidence.py tests/test_p08_sg000023_paper_evidence.py
          python -m ruff check --fix tools/build_sg000023_paper_evidence.py tests/test_p08_sg000023_paper_evidence.py
          python tools/build_sg000023_paper_evidence.py --check
          git diff --check

      - name: Commit bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git add tools/build_sg000023_paper_evidence.py tests/test_p08_sg000023_paper_evidence.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'No repair changes required.'
            exit 0
          fi
          git commit -m 'DAL-P08: repair SG-000023 evidence lint without semantic changes'
          git push origin HEAD:feat/sg000023-paper-evidence
