name: DAL R2 synthetic SDK qualification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FHIR_AGENTBENCH_REVISION: "bbb42909a5a7eb907d1cd91f72a560729e7037ea"
  OPENAI_API_KEY: "dal-local-query-trace-gate"
  GEMINI_API_KEY: "dal-unused-synthetic-provider"

jobs:
  synthetic-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install DAL and frozen upstream dependencies
        run: >-
          python -m pip install -e . -c registry/study1_sg000031_producer_constraints.txt
          litellm==1.75.9
          tiktoken==0.8.0
          pandas==2.3.2
          numpy==2.3.2
          PyYAML==6.0.2
          requests==2.32.5
          google-auth==2.40.3
          sqlglot==26.9.0
          sqlparse==0.5.3
          tqdm==4.66.5

      - name: Checkout and verify frozen FHIR-AgentBench source
        shell: bash
        run: |
          set -euo pipefail
          upstream="$RUNNER_TEMP/fhir-agentbench"
          git clone --filter=blob:none https://github.com/glee4810/FHIR-AgentBench.git "$upstream"
          git -C "$upstream" checkout --detach "$FHIR_AGENTBENCH_REVISION"
          test "$(git -C "$upstream" rev-parse HEAD)" = "$FHIR_AGENTBENCH_REVISION"
          test "$(git -C "$upstream" hash-object utils/core_utils.py)" = \
            "6544570985916074f40a5fb469243aa5ced22f65"
          test "$(git -C "$upstream" hash-object agent/single_turn_request_agent.py)" = \
            "1188a4053560924c3ed801e9b1aaa91ccd6d010d"
          test "$(git -C "$upstream" hash-object tools/request_tools.py)" = \
            "0f50e1c4aae7fdfee4e2c83c7c9954f9c3e811d0"

      - name: Apply canonical provenance correction and verify transport patch
        shell: python
        run: |
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          freeze = json.loads(
              Path("registry/study1_sg000027_trace_producer_freeze.json").read_text(
                  encoding="utf-8"
              )
          )
          correction = json.loads(
              Path(
                  "registry/study1_sg000028_trace_producer_provenance_correction.json"
              ).read_text(encoding="utf-8")
          )
          repair_contract = json.loads(
              Path("registry/study1_sg000027_transport_repair_contract.json").read_text(
                  encoding="utf-8"
              )
          )
          sg28_contract = json.loads(
              Path("registry/study1_sg000028_contract.json").read_text(encoding="utf-8")
          )
          frozen_transport = freeze["trace_producer_identity"]["fhir_agentbench"]
          incorrect = correction["incorrect_freeze_provenance"]
          corrected = correction["correct_canonical_repair_provenance"]
          repair = repair_contract["repair"]
          sg28 = sg28_contract["trace_producer"]
          keys = (
              "transport_patch_sha256",
              "patched_core_utils_blob_sha",
              "patched_core_utils_sha256",
          )
          for key in keys:
              if frozen_transport[key] != incorrect[key]:
                  raise SystemExit(f"historical D3 freeze provenance drift: {key}")
              if sg28[key] != corrected[key]:
                  raise SystemExit(f"SG-000028 provenance overlay drift: {key}")
          if repair["patch_sha256"] != corrected["transport_patch_sha256"]:
              raise SystemExit("canonical transport patch SHA-256 drift")
          if repair["patched_core_utils_blob_sha"] != corrected["patched_core_utils_blob_sha"]:
              raise SystemExit("canonical patched core blob drift")
          if repair["patched_core_utils_sha256"] != corrected["patched_core_utils_sha256"]:
              raise SystemExit("canonical patched core SHA-256 drift")
          if repair["patch_path"] != corrected["patch_path"]:
              raise SystemExit("canonical transport patch path drift")
          if sg28["transport_patch_path"] != corrected["patch_path"]:
              raise SystemExit("SG-000028 transport patch path drift")
          if correction["semantic_invariants"]["behavior_changed"] is not False:
              raise SystemExit("provenance correction cannot change behavior")
          if correction["semantic_invariants"]["post_outcome_trace_producer_switching"] is not False:
              raise SystemExit("provenance correction cannot switch trace producer")

          upstream = Path(os.environ["RUNNER_TEMP"]) / "fhir-agentbench"
          patch = Path(corrected["patch_path"])
          patch_sha = hashlib.sha256(patch.read_bytes()).hexdigest()
          if patch_sha != corrected["transport_patch_sha256"]:
              raise SystemExit(f"transport patch SHA-256 drift: {patch_sha}")
          subprocess.run(
              ["git", "-C", str(upstream), "apply", "--check", str(patch.resolve())],
              check=True,
          )
          subprocess.run(
              ["git", "-C", str(upstream), "apply", str(patch.resolve())],
              check=True,
          )
          core = upstream / "utils/core_utils.py"
          blob = subprocess.check_output(
              ["git", "-C", str(upstream), "hash-object", str(core)],
              text=True,
          ).strip()
          digest = hashlib.sha256(core.read_bytes()).hexdigest()
          if blob != corrected["patched_core_utils_blob_sha"]:
              raise SystemExit(f"patched core blob drift: {blob}")
          if digest != corrected["patched_core_utils_sha256"]:
              raise SystemExit(f"patched core SHA-256 drift: {digest}")
          print("trace_producer_provenance_overlay=VERIFIED")

      - name: Qualify actual frozen SDK with synthetic HTTP only
        run: >-
          python tools/qualify_sg000031_sdk.py
          --upstream-root "$RUNNER_TEMP/fhir-agentbench"
          --output "$RUNNER_TEMP/sdk-qualification.json"
      - name: Verify source-bound canonical synthetic qualification
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          expected = json.loads(Path("registry/study1_sg000031_sdk_qualification.json").read_bytes())
          actual = json.loads((Path(os.environ["RUNNER_TEMP"]) / "sdk-qualification.json").read_bytes())
          if actual != expected:
              raise SystemExit("synthetic SDK qualification/source identity drift")
          print("SYNTHETIC_SDK_QUALIFICATION=PASS; MODEL_INFERENCE=false")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sg000031-synthetic-sdk-${{ github.run_id }}
          path: ${{ runner.temp }}/sdk-qualification.json
          if-no-files-found: error
          retention-days: 30
